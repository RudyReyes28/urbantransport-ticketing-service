spring.application.name=ticketing-service
server.port=${SERVER_PORT:8084}

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketing_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# --- Seguridad: valida el JWT de identity con su llave pública ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# --- Reglas de negocio configurables ---
ticketing.order-ttl=5m
ticketing.max-seats-per-order=10
ticketing.max-pending-orders-per-customer=2
ticketing.business-zone=America/Guatemala
ticketing.expiration-interval=30s

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=ticketing-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

ticketing.kafka.ticket-events-topic=ticket-events
ticketing.kafka.trip-events-topic=trip-events
ticketing.kafka.payment-events-topic=payment-events
ticketing.outbox.poll-interval-ms=1000


logging.pattern.level=%5p [%X{correlationId:-}]

management.endpoints.web.exposure.include=health